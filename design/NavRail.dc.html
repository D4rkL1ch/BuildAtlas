<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Atlas – Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Build Atlas sections" style="width:176px;height:{{h}}px;box-sizing:border-box;background:#0F1115;border-right:1px solid #2C313D;display:flex;flex-direction:column;padding:12px 10px;gap:2px;font-family:Inter,sans-serif;color:#E7E4DA">
  <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
    <div style="font:600 10px Inter,sans-serif;color:#8C92A0;text-transform:uppercase;letter-spacing:.1em;padding:12px 10px 6px">{{grp.label}}</div>
    <sc-for list="{{grp.items}}" as="item" hint-placeholder-count="3">
      <a href="{{item.href}}" style="{{item.style}}" aria-current="{{item.current}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
        <span>{{item.label}}</span>
      </a>
    </sc-for>
  </sc-for>
  <div style="flex:1"></div>
  <div style="border-top:1px solid #2C313D;padding:12px 10px 4px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#8FD3A0"><span style="width:8px;height:8px;border-radius:4px;background:#5BB974"></span>Out of combat</div>
    <div style="font:500 10px 'JetBrains Mono',monospace;color:#8C92A0">v0.1 · interface 16001</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["planner","synergy","compare","presets","leveling","report","bench","gear","share"],"default":"planner"},"h":{"editor":"int","default":744},"$preview":{"width":176,"height":800}}'>
var GROUPS = [
  { label: 'Plan', items: [
    { key: 'planner', label: 'Talent planner', href: 'Main.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM9 14h6v6H9zM7 10v2h10v-2M12 12v2' },
    { key: 'synergy', label: 'Synergy map', href: 'SynergyMap.dc.html', d: 'M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M12 18a2 2 0 1 0 0 .1M7 6h10M6 8l5 8M18 8l-5 8' },
    { key: 'compare', label: 'Compare builds', href: 'Compare.dc.html', d: 'M4 5h7v14H4zM13 5h7v14h-7z' },
    { key: 'presets', label: 'Presets', href: 'Presets.dc.html', d: 'M5 4h14v16l-7-4-7 4z' },
    { key: 'leveling', label: 'Leveling path', href: 'Leveling.dc.html', d: 'M4 20h4v-5h4v-5h4V5h4' }
  ]},
  { label: 'Measure', items: [
    { key: 'report', label: 'Fight report', href: 'FightReport.dc.html', d: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
    { key: 'bench', label: 'Benchmark', href: 'Benchmark.dc.html', d: 'M12 13l4-4M4 18a8 8 0 1 1 16 0' }
  ]},
  { label: 'Gear & share', items: [
    { key: 'gear', label: 'Stats & gear', href: 'Gear.dc.html', d: 'M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z' },
    { key: 'share', label: 'Import / export', href: 'Share.dc.html', d: 'M12 15V3M7 8l5-5 5 5M5 14v6h14v-6' }
  ]}
];
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'planner';
    return {
      h: this.props.h ?? 744,
      groups: GROUPS.map(function (g) {
        return { label: g.label, items: g.items.map(function (it) {
          var on = it.key === active;
          return { href: it.href, label: it.label, d: it.d, current: on ? 'page' : 'false',
            style: 'display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:6px;text-decoration:none;font:500 13px Inter,sans-serif;' +
              (on ? 'background:#2A2416;color:#F3E3B5;box-shadow:inset 0 0 0 1px #7A6327' : 'color:#C4C7CF') };
        }) };
      })
    };
  }
}
</script>
</body>
</html>
